# docker compose up -d
# Then open http://<this machine>:3100
#
# This downloads the prebuilt image. To build it from this source folder instead
# (your own changes, or a custom poster width): docker compose up -d --build
services:
  jelly-shark:
    # Newest beta. Pin an exact version (for example :0.1.0-beta.1) to stay put on updates.
    image: ghcr.io/heavylvy/jelly-shark:beta
    build:
      context: .
      args:
        # Poster width in px (120-400), baked in at build time. Default 215.
        # Only used when you build the image yourself; the prebuilt image uses 215.
        NEXT_PUBLIC_POSTER_WIDTH: ${NEXT_PUBLIC_POSTER_WIDTH:-215}
    container_name: jelly-shark
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      # Your Jellyfin server, reachable from inside the container (use its LAN IP, not localhost).
      JELLYFIN_URL: ${JELLYFIN_URL:?set JELLYFIN_URL in .env}
      # 32+ random characters used to encrypt the session cookie: openssl rand -base64 48
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    volumes:
      - jelly-shark-data:/data

volumes:
  jelly-shark-data:
