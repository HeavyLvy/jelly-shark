name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Jelly Shark is a Jellyfin frontend. Ideas that need a change in Jellyfin itself, or that a web app can't do
        (see the notes in TODO.md), can't be built here, but are still worth asking about.

        This is a spare-time project. Opening a request doesn't promise it gets built, or when.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues and nobody has asked for this yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you can't do, or what is annoying, today. Start from the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Your idea of the solution. Sketches or screenshots from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: dropdown
    id: area
    attributes:
      label: Where does it belong?
      options:
        - Home / browsing
        - Movies and shows
        - Music
        - Video player
        - Search
        - Settings / administration
        - Phone layout
        - Install / Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Could you help build it?
      options:
        - "No, I'm just suggesting it"
        - "Yes, I'd like to send a pull request"
        - "I can test it"
    validations:
      required: true
