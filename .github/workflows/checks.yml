# Checks every push and pull request the way a fresh clone sees the repo:
# no .env file, so anything that needs JELLYFIN_URL or SESSION_SECRET while
# *building* (instead of at request time) fails here instead of in the Docker image.

name: checks

on:
  push:
    branches: [beta, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: type check
        # Next generates the route/layout types (like LayoutProps) during a build; a fresh clone has none yet.
        run: npx next typegen && npx tsc --noEmit

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      # Same job on purpose: "build" is the check the beta ruleset requires, so the tests are required too.
      - name: unit tests
        run: npm test

      - name: install the test browser
        run: npx playwright install --with-deps chromium

      - name: browser tests (desktop and phone sizes, against the mock Jellyfin)
        run: npm run test:e2e

      - name: keep the screenshots and traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
